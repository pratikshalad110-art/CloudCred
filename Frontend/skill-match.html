<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CloudCred - Skill Match</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">


<!-- Navigation -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="dashboard.html"
           class="navbar-brand fw-bold">

            CloudCred

        </a>

        <a href="dashboard.html"
           class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>


<!-- Main Content -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center text-primary mb-2">
                        🤖 AI Skill Matching
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Compare your skills with the skills
                        required for a job.
                    </p>


                    <div id="message"></div>


                    <!-- Student Skills -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Your Skills
                        </label>

                        <textarea
                            id="studentSkills"
                            class="form-control"
                            rows="4"
                            placeholder="Example: Python, Java, HTML, CSS, SQL"
                            required></textarea>

                        <small class="text-muted">
                            Enter skills separated by commas.
                        </small>

                    </div>


                    <!-- Required Skills -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Required Job Skills
                        </label>

                        <textarea
                            id="requiredSkills"
                            class="form-control"
                            rows="4"
                            placeholder="Example: Python, SQL, JavaScript, HTML"
                            required></textarea>

                        <small class="text-muted">
                            Enter required skills separated by commas.
                        </small>

                    </div>


                    <!-- Button -->

                    <button
                        type="button"
                        class="btn btn-primary w-100"
                        onclick="matchSkills()">

                        🔍 Match Skills

                    </button>


                    <!-- Result -->

                    <div
                        id="result"
                        class="mt-4"
                        style="display: none;">

                        <h4 class="text-center text-primary">
                            Skill Match Result
                        </h4>

                        <hr>


                        <div class="row text-center">

                            <div class="col-md-4 mb-3">

                                <div class="card bg-success text-white">

                                    <div class="card-body">

                                        <h6>
                                            Match Score
                                        </h6>

                                        <h2>
                                            <span id="matchScore">
                                                0
                                            </span>%
                                        </h2>

                                    </div>

                                </div>

                            </div>


                            <div class="col-md-4 mb-3">

                                <div class="card bg-primary text-white">

                                    <div class="card-body">

                                        <h6>
                                            Matched Skills
                                        </h6>

                                        <p
                                            id="matchedSkills"
                                            class="mb-0">
                                        </p>

                                    </div>

                                </div>

                            </div>


                            <div class="col-md-4 mb-3">

                                <div class="card bg-danger text-white">

                                    <div class="card-body">

                                        <h6>
                                            Missing Skills
                                        </h6>

                                        <p
                                            id="missingSkills"
                                            class="mb-0">
                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL =
    "https://cloudcred.onrender.com";



// ==========================================
// MATCH SKILLS
// ==========================================

async function matchSkills() {

    const studentSkillsText =
        document.getElementById(
            "studentSkills"
        ).value.trim();


    const requiredSkillsText =
        document.getElementById(
            "requiredSkills"
        ).value.trim();


    if (!studentSkillsText) {

        showMessage(
            "Please enter your skills.",
            "warning"
        );

        return;
    }


    if (!requiredSkillsText) {

        showMessage(
            "Please enter the required job skills.",
            "warning"
        );

        return;
    }


    // Convert comma-separated text
    // into arrays

    const studentSkills =
        studentSkillsText
            .split(",")
            .map(skill => skill.trim())
            .filter(skill => skill.length > 0);


    const requiredSkills =
        requiredSkillsText
            .split(",")
            .map(skill => skill.trim())
            .filter(skill => skill.length > 0);


    try {

        const response =
            await fetch(
                API_URL + "/skill-match",
                {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        student_skills:
                            studentSkills,

                        required_skills:
                            requiredSkills

                    })

                }
            );


        const data =
            await response.json();


        // Login required

        if (response.status === 401) {

            window.location.href =
                "login.html";

            return;
        }


        // Error

        if (!response.ok) {

            showMessage(
                data.message ||
                "Skill matching failed.",
                "danger"
            );

            return;
        }


        // Show success message

        showMessage(
            "Skill matching completed successfully.",
            "success"
        );


        // Show result section

        document.getElementById(
            "result"
        ).style.display = "block";


        // Match score

        document.getElementById(
            "matchScore"
        ).textContent =
            data.match_score;


        // Matched skills

        const matched =
            data.matched_skills || [];


        document.getElementById(
            "matchedSkills"
        ).textContent =
            matched.length > 0
                ? matched.join(", ")
                : "None";


        // Missing skills

        const missing =
            data.missing_skills || [];


        document.getElementById(
            "missingSkills"
        ).textContent =
            missing.length > 0
                ? missing.join(", ")
                : "None";

    }


    catch (error) {

        console.error(error);

        showMessage(
            "Cannot connect to Flask server.",
            "danger"
        );

    }

}


// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, type) {

    document.getElementById(
        "message"
    ).innerHTML =

        `<div class="alert alert-${type}">
            ${message}
        </div>`;

}

</script>


</body>

</html>
