<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CloudCred - Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">

<!-- Navigation -->
<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand fw-bold">
            CloudCred
        </span>

        <button
            class="btn btn-light"
            onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<!-- Dashboard -->
<div class="container py-5">

    <h2 class="mb-4">
        Student Dashboard
    </h2>

    <div id="message"></div>

    <div class="card shadow">

        <div class="card-body">

            <h4 class="text-primary">
                Welcome, <span id="studentName">Student</span>
            </h4>

            <hr>

            <p>
                <strong>Student ID:</strong>
                <span id="studentId">Loading...</span>
            </p>

            <p>
                <strong>Name:</strong>
                <span id="name">Loading...</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="email">Loading...</span>
            </p>

        </div>

    </div>


    <!-- Actions -->

    <div class="row g-3 mt-4">

        <div class="col-md-4">

            <a href="profile.html"
               class="btn btn-primary w-100">

                👤 Manage Profile

            </a>

        </div>


        <div class="col-md-4">

            <a href="upload.html"
               class="btn btn-success w-100">

                📄 Resume & Certificates

            </a>

        </div>


        <div class="col-md-4">

            <a href="credential.html"
               class="btn btn-dark w-100">

                🔳 My Credential

            </a>

        </div>


        <!-- AI SKILL MATCH - ADDED -->

        <div class="col-md-4">

            <a href="skill-match.html"
               class="btn btn-warning w-100">

                🤖 AI Skill Match

            </a>

        </div>

    </div>

</div>


<script>

async function loadDashboard() {

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/dashboard",
            {
                method: "GET",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            document.getElementById("message")
                .innerHTML =
                `<div class="alert alert-danger">
                    ${data.message}
                </div>`;

            return;
        }

        document.getElementById("studentName")
            .textContent = data.name;

        document.getElementById("studentId")
            .textContent = data.student_id;

        document.getElementById("name")
            .textContent = data.name;

        document.getElementById("email")
            .textContent = data.email;

    }

    catch (error) {

        document.getElementById("message")
            .innerHTML =
            `<div class="alert alert-danger">
                Cannot connect to Flask server.
            </div>`;

    }

}


async function logout() {

    try {

        await fetch(
            "http://127.0.0.1:5000/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

        window.location.href = "login.html";

    }

    catch (error) {

        window.location.href = "login.html";

    }

}


loadDashboard();

</script>

</body>
</html>
