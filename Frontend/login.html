<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CloudCred - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">


            <div class="card shadow mt-5">

                <div class="card-body p-4">


                    <h2 class="text-center text-primary mb-4">

                        CloudCred Login

                    </h2>


                    <div id="message"></div>


                    <form id="loginForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>


                    </form>


                    <p class="text-center mt-3">

                        Don't have an account?

                        <a href="register.html">
                            Register
                        </a>

                    </p>


                </div>

            </div>


        </div>

    </div>

</div>



<script>


const API_URL =
    "http://127.0.0.1:5000";



document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            try {


                const response =
                    await fetch(
                        API_URL + "/login",
                        {

                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {


                    document.getElementById(
                        "message"
                    ).innerHTML =

                        `<div class="alert alert-success">
                            Login successful!
                        </div>`;


                    // Give browser time
                    // to save the session cookie

                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );


                } else {


                    document.getElementById(
                        "message"
                    ).innerHTML =

                        `<div class="alert alert-danger">
                            ${data.message ||
                            "Login failed"}
                        </div>`;

                }


            } catch (error) {


                console.error(error);


                document.getElementById(
                    "message"
                ).innerHTML =

                    `<div class="alert alert-danger">
                        Cannot connect to Flask server.
                    </div>`;

            }


        }
    );

</script>


</body>

</html>
