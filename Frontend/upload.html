<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudCred - Documents</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .upload-card {
            max-width: 750px;
            margin: 40px auto;
        }

        .document-card {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a href="dashboard.html"
           class="navbar-brand fw-bold">
            CloudCred
        </a>

        <a href="dashboard.html"
           class="btn btn-light">
            Dashboard
        </a>

    </div>
</nav>


<div class="container">

    <div class="card shadow upload-card">

        <div class="card-body p-4">

            <h2 class="text-primary mb-4">
                Resume & Certificates
            </h2>

            <div id="message"></div>


            <!-- RESUME -->

            <h5>
                Upload Resume
            </h5>

            <input
                type="file"
                id="resume"
                class="form-control"
                accept=".pdf,application/pdf">

            <button
                type="button"
                class="btn btn-primary mt-2"
                onclick="uploadResume()">

                Upload Resume

            </button>


            <hr class="my-4">


            <!-- CERTIFICATE -->

            <h5>
                Upload Certificate
            </h5>

            <input
                type="file"
                id="certificate"
                class="form-control"
                accept=".pdf,application/pdf">

            <button
                type="button"
                class="btn btn-success mt-2"
                onclick="uploadCertificate()">

                Upload Certificate

            </button>


            <hr class="my-4">


            <!-- DOCUMENTS -->

            <h4 class="text-primary">
                Uploaded Documents
            </h4>

            <div id="documents">
                <p class="text-muted">
                    Loading documents...
                </p>
            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:5000";


/* =========================
   MESSAGE
========================= */

function showMessage(message, type) {

    document.getElementById("message").innerHTML =
        `
        <div class="alert alert-${type}">
            ${message}
        </div>
        `;
}


/* =========================
   RESUME
========================= */

async function uploadResume() {

    const input =
        document.getElementById("resume");

    if (input.files.length === 0) {

        showMessage(
            "Please select a resume PDF.",
            "warning"
        );

        return;
    }

    await uploadFile(
        input.files[0],
        "resume"
    );
}


/* =========================
   CERTIFICATE
========================= */

async function uploadCertificate() {

    const input =
        document.getElementById("certificate");

    if (input.files.length === 0) {

        showMessage(
            "Please select a certificate PDF.",
            "warning"
        );

        return;
    }

    await uploadFile(
        input.files[0],
        "certificate"
    );
}


/* =========================
   UPLOAD
========================= */

async function uploadFile(file, fileType) {

    const formData = new FormData();

    formData.append("file", file);
    formData.append("file_type", fileType);

    try {

        const response = await fetch(
            API_URL + "/upload",
            {
                method: "POST",
                credentials: "include",
                body: formData
            }
        );

        const data = await response.json();

        if (response.status === 401) {

            showMessage(
                "Please login first.",
                "warning"
            );

            return;
        }

        if (!response.ok) {

            showMessage(
                data.message || "Upload failed.",
                "danger"
            );

            return;
        }

        showMessage(
            data.message ||
            "File uploaded successfully.",
            "success"
        );

        inputClear(fileType);

        loadDocuments();

    } catch (error) {

        console.error("UPLOAD ERROR:", error);

        showMessage(
            "Connection error: " + error.message,
            "danger"
        );
    }
}


/* =========================
   CLEAR FILE INPUT
========================= */

function inputClear(fileType) {

    if (fileType === "resume") {

        document.getElementById("resume").value = "";

    }

    if (fileType === "certificate") {

        document.getElementById("certificate").value = "";

    }
}


/* =========================
   LOAD DOCUMENTS
========================= */

async function loadDocuments() {

    const documentsDiv =
        document.getElementById("documents");

    documentsDiv.innerHTML =
        `
        <p class="text-muted">
            Loading documents...
        </p>
        `;

    try {

        const response = await fetch(
            API_URL + "/documents",
            {
                method: "GET",
                credentials: "include"
            }
        );

        const data = await response.json();

        console.log(
            "Documents response:",
            data
        );


        /* LOGIN */

        if (response.status === 401) {

            documentsDiv.innerHTML =
                `
                <div class="alert alert-warning">

                    Please login first.

                    <br><br>

                    <a
                        href="login.html"
                        class="btn btn-primary">

                        Login Again

                    </a>

                </div>
                `;

            return;
        }


        /* SERVER ERROR */

        if (!response.ok) {

            documentsDiv.innerHTML =
                `
                <div class="alert alert-danger">

                    ${data.message ||
                    "Unable to load documents."}

                </div>
                `;

            return;
        }


        /* NO DOCUMENTS */

        if (
            !data.documents ||
            data.documents.length === 0
        ) {

            documentsDiv.innerHTML =
                `
                <div class="alert alert-info">

                    No documents uploaded yet.

                </div>
                `;

            return;
        }


        /* CLEAR */

        documentsDiv.innerHTML = "";


        /*
         IMPORTANT:
         Use "doc" here, NOT "document".
         This prevents conflict with the
         browser's document object.
        */

        data.documents.forEach(function(doc) {

            const card =
                document.createElement("div");

            card.className =
                "card document-card shadow-sm";


            let badgeColor = "secondary";


            if (doc.file_type === "resume") {

                badgeColor = "primary";

            }


            if (doc.file_type === "certificate") {

                badgeColor = "success";

            }


            card.innerHTML =
                `
                <div class="card-body">

                    <span class="badge bg-${badgeColor}">
                        ${doc.file_type}
                    </span>

                    <p class="mt-2 mb-2">

                        <strong>
                            ${doc.filename}
                        </strong>

                    </p>

                    <a
                        href="${API_URL}/download/${doc.id}"
                        class="btn btn-sm btn-outline-primary">

                        Download

                    </a>

                </div>
                `;


            documentsDiv.appendChild(card);

        });


    } catch (error) {

        console.error(
            "DOCUMENT ERROR:",
            error
        );

        documentsDiv.innerHTML =
            `
            <div class="alert alert-danger">

                Error loading documents:
                ${error.message}

            </div>
            `;

    }
}


/* =========================
   START
========================= */

loadDocuments();

</script>

</body>

</html>
