<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudCred - Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fb;
        }

        .profile-card {
            max-width: 650px;
            margin: 50px auto;
        }

        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">
            CloudCred
        </a>

        <a href="dashboard.html" class="btn btn-light">
            Dashboard
        </a>
    </div>
</nav>


<!-- Profile Form -->
<div class="container">

    <div class="card shadow profile-card">

        <div class="card-body p-4">

            <h2 class="text-center text-primary mb-4">
                Student Profile
            </h2>

            <div id="message"></div>

            <form id="profileForm">

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="Enter phone number"
                    >
                </div>


                <!-- College -->
                <div class="mb-3">
                    <label class="form-label">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        class="form-control"
                        placeholder="Enter college name"
                    >
                </div>


                <!-- Course -->
                <div class="mb-3">
                    <label class="form-label">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        class="form-control"
                        placeholder="Enter course"
                    >
                </div>


                <!-- Graduation Year -->
                <div class="mb-3">
                    <label class="form-label">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduation_year"
                        class="form-control"
                        placeholder="Example: 2027"
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    Save Profile
                </button>

            </form>

        </div>

    </div>

</div>


<script>

const API_URL = "https://cloudcred.onrender.com";



// ==========================================
// LOAD EXISTING PROFILE
// ==========================================

async function loadProfile() {

    try {

        const response = await fetch(
            API_URL + "/profile",
            {
                method: "GET",
                credentials: "include"
            }
        );

        const data = await response.json();

        // Profile doesn't exist yet
        if (response.status === 404) {
            return;
        }

        // Login required
        if (response.status === 401) {

            window.location.href =
                "login.html";

            return;
        }

        if (!response.ok) {
            return;
        }

        document.getElementById("phone").value =
            data.phone || "";

        document.getElementById("college").value =
            data.college || "";

        document.getElementById("course").value =
            data.course || "";

        document.getElementById("graduation_year").value =
            data.graduation_year || "";

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Cannot connect to Flask server.",
            "danger"
        );
    }
}


// ==========================================
// SAVE PROFILE
// ==========================================

document.getElementById("profileForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const phone =
        document.getElementById("phone").value.trim();

    const college =
        document.getElementById("college").value.trim();

    const course =
        document.getElementById("course").value.trim();

    const graduationYear =
        document.getElementById("graduation_year").value;


    try {

        const response = await fetch(
            API_URL + "/profile",
            {
                method: "PUT",

                credentials: "include",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    phone: phone,

                    college: college,

                    course: course,

                    graduation_year:
                        graduationYear
                        ? parseInt(graduationYear)
                        : null

                })
            }
        );


        const data = await response.json();


        if (response.status === 401) {

            window.location.href =
                "login.html";

            return;
        }


        if (response.ok) {

            showMessage(
                "Profile updated successfully",
                "success"
            );

        } else {

            showMessage(
                data.message ||
                "Profile update failed",
                "danger"
            );
        }

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Cannot connect to Flask server.",
            "danger"
        );
    }

});


// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, type) {

    document.getElementById("message")
        .innerHTML =

        `<div class="alert alert-${type}">
            ${message}
        </div>`;
}


// ==========================================
// START
// ==========================================

loadProfile();

</script>

</body>
</html>
