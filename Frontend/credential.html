<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudCred - My Credential</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .credential-card {
            max-width: 700px;
            margin: 50px auto;
        }

        #qrImage {
            max-width: 250px;
            margin: 20px auto;
            display: block;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="dashboard.html"
           class="navbar-brand fw-bold">
            CloudCred
        </a>

        <a href="dashboard.html"
           class="btn btn-light">
            Dashboard
        </a>
    </div>
</nav>


<div class="container">

    <div class="card shadow credential-card">

        <div class="card-body p-4">

            <h2 class="text-primary mb-4">
                My Credential
            </h2>

            <div id="message"></div>

            <div id="credentialInfo">

                <p class="text-muted">
                    Checking credential...
                </p>

            </div>

            <div class="text-center">

                <img
                    id="qrImage"
                    style="display:none;"
                    alt="Credential QR Code">

            </div>

            <div class="d-grid gap-2 mt-3">

                <button
                    id="generateCredentialBtn"
                    class="btn btn-primary"
                    onclick="generateCredential()">

                    Generate Credential

                </button>

                <button
                    id="generateQRBtn"
                    class="btn btn-success"
                    onclick="generateQR()">

                    Generate QR Code

                </button>

            </div>

            <div
                id="verification"
                class="mt-4">
            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:5000";


/* ==============================
   MESSAGE
============================== */

function showMessage(message, type) {

    document.getElementById("message").innerHTML =
        `
        <div class="alert alert-${type}">
            ${message}
        </div>
        `;
}


/* ==============================
   CHECK EXISTING CREDENTIAL
============================== */

async function checkCredential() {

    try {

        const response = await fetch(
            API_URL + "/dashboard",
            {
                method: "GET",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (response.status === 401) {

            showMessage(
                "Please login first.",
                "warning"
            );

            return;
        }

        if (!response.ok) {

            showMessage(
                data.message || "Unable to load account.",
                "danger"
            );

            return;
        }

        document.getElementById("credentialInfo").innerHTML =
            `
            <div class="alert alert-info">

                <strong>Student:</strong>
                ${data.name}

                <br>

                <strong>Email:</strong>
                ${data.email}

                <br>

                <strong>Student ID:</strong>
                ${data.student_id}

            </div>

            <p class="text-muted">
                Click "Generate Credential" to create your CloudCred credential.
            </p>
            `;

    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error: " + error.message,
            "danger"
        );
    }
}


/* ==============================
   GENERATE CREDENTIAL
============================== */

async function generateCredential() {

    try {

        const response = await fetch(
            API_URL + "/generate-credential",
            {
                method: "POST",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (response.status === 401) {

            showMessage(
                "Please login first.",
                "warning"
            );

            return;
        }

        if (!response.ok) {

            showMessage(
                data.message || "Credential generation failed.",
                "danger"
            );

            return;
        }

        showMessage(
            data.message,
            "success"
        );

        document.getElementById("credentialInfo").innerHTML =
            `
            <div class="alert alert-success">

                <h5>
                    Credential Created
                </h5>

                <strong>
                    Credential ID:
                </strong>

                ${data.credential_id}

            </div>
            `;

        document.getElementById(
            "generateCredentialBtn"
        ).disabled = true;

    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error: " + error.message,
            "danger"
        );
    }
}


/* ==============================
   GENERATE QR
============================== */

async function generateQR() {

    try {

        const response = await fetch(
            API_URL + "/generate-qr",
            {
                method: "POST",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (response.status === 401) {

            showMessage(
                "Please login first.",
                "warning"
            );

            return;
        }

        if (!response.ok) {

            showMessage(
                data.message || "QR generation failed.",
                "danger"
            );

            return;
        }

        showMessage(
            data.message,
            "success"
        );


        /* SHOW QR */

        const qrImage =
            document.getElementById("qrImage");

        qrImage.src =
            API_URL +
            "/qr/" +
            data.qr_filename;

        qrImage.style.display = "block";


        /* SHOW VERIFICATION LINK */

        document.getElementById(
            "verification"
        ).innerHTML =
            `
            <div class="alert alert-info">

                <strong>
                    Verification URL
                </strong>

                <br><br>

                <a
                    href="${data.verification_url}"
                    target="_blank"
                    class="btn btn-outline-primary">

                    Verify Credential

                </a>

                <br><br>

                <small>
                    ${data.verification_url}
                </small>

            </div>
            `;

    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error: " + error.message,
            "danger"
        );
    }
}


/* ==============================
   START
============================== */

checkCredential();

</script>

</body>
</html>
